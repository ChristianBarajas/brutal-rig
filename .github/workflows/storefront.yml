name: Storefront catalog

on:
  pull_request:
    paths:
      - "storefront/**"
      - "src/data/gear.js"
      - ".github/workflows/storefront.yml"
  push:
    branches:
      - main
    paths:
      - "storefront/**"
      - "src/data/gear.js"
      - ".github/workflows/storefront.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci --prefix storefront
      - run: npm test --prefix storefront
      - run: npm run build --prefix storefront
